name: Publish GitHub Release

on:
    push:
        tags:
            - '*'

jobs:
    build-and-release:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Check tag matches theme version
              run: |
                  # Tags may be "1.2.3" or "v1.2.3"; style.css must carry the same number.
                  TAG="${GITHUB_REF_NAME#v}"
                  VERSION=$(sed -n 's/^Version: *//p' style.css | tr -d '\r')
                  if [ "$TAG" != "$VERSION" ]; then
                      echo "::error::Tag $GITHUB_REF_NAME does not match style.css Version $VERSION"
                      exit 1
                  fi

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build theme
              run: npm run build

            - name: Prepare Release Artifact
              run: |
                  # 1. Create a build directory named after the theme slug
                  mkdir core

                  # 2. Copy files to build dir (the leading slash anchors the
                  #    exclude to the root, so nothing else named "core" is skipped)
                  rsync -rc --exclude-from='.distignore' --exclude '/core/' . core/

                  # 3. CLEANUP: Force remove any .DS_Store files that slipped through
                  find core -name ".DS_Store" -type f -delete

                  # 4. Zip the clean directory
                  zip -r core.zip core
            - name: Create Release
              uses: ncipollo/release-action@v1.14.0
              with:
                  artifacts: 'core.zip'
                  token: ${{ secrets.GITHUB_TOKEN }}
                  allowUpdates: true
                  makeLatest: true
                  tag: ${{ github.ref_name }}
                  name: 'Core ${{ github.ref_name }}'
                  body: 'Core theme release ${{ github.ref_name }}'
